# Reverse proxy for the web panel.
#
# Before using it, replace:
#   example.com          -> your domain
#   /opt/translator-bot  -> the real install path
#   443                  -> another port, if 443 is already taken on your server
#
# The certificate is assumed to come from certbot. If you use another issuer,
# change the ssl_certificate / ssl_certificate_key paths.

limit_req_zone $binary_remote_addr zone=panel_login:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=panel_all:10m rate=60r/m;
limit_conn_zone $binary_remote_addr zone=panel_conn:10m;

server {
	listen 80;
	listen [::]:80;
	server_name example.com www.example.com;

	location /.well-known/acme-challenge/ {
		root /var/www/certbot;
	}

	location / {
		return 301 https://$host$request_uri;
	}
}

server {
	listen 443 ssl http2;
	listen [::]:443 ssl http2;
	server_name example.com www.example.com;

	ssl_certificate /etc/letsencrypt/live/example.com/fullchain.pem;
	ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;
	ssl_protocols TLSv1.2 TLSv1.3;
	ssl_prefer_server_ciphers off;
	ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
	ssl_session_cache shared:SSL:10m;
	ssl_session_timeout 1d;
	ssl_session_tickets off;

	# The application sets its own security headers on every response it serves, so
	# they are not repeated here. Only /static/ is served by nginx directly and
	# therefore needs its own set, below.

	server_tokens off;
	client_max_body_size 1m;
	limit_conn panel_conn 20;

	access_log /var/log/nginx/translator-panel.access.log;
	error_log /var/log/nginx/translator-panel.error.log;

	location /static/ {
		alias /opt/translator-bot/webpanel/static/;
		expires 30d;
		add_header Cache-Control "public, immutable";
		add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
		add_header X-Content-Type-Options "nosniff" always;
		add_header X-Frame-Options "DENY" always;
		add_header Referrer-Policy "strict-origin-when-cross-origin" always;
	}

	location = /login {
		limit_req zone=panel_login burst=5 nodelay;
		limit_req_status 429;

		proxy_pass http://127.0.0.1:8000;
		proxy_http_version 1.1;
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto https;
		proxy_read_timeout 30s;
		proxy_connect_timeout 5s;
	}

	location / {
		limit_req zone=panel_all burst=30 nodelay;
		limit_req_status 429;

		proxy_pass http://127.0.0.1:8000;
		proxy_http_version 1.1;
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto https;
		proxy_read_timeout 30s;
		proxy_connect_timeout 5s;
	}
}
